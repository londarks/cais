name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Compilar
        run: dotnet build Cais.csproj -c Release -nologo
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cais
          path: bin/Release/net48/
